site_name: pymcfs
site_description: Mean-curvature-flow skeletonization for triangle meshes
site_url: https://pymcfs.readthedocs.io/en/latest/
repo_url: https://github.com/jmrfox/pymcfs
repo_name: jmrfox/pymcfs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            members_order: source
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            separate_signature: true
            merge_init_into_class: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Quick start: getting-started/quickstart.md
  - User guide:
      - Meshes and validation: guide/meshes.md
      - Profiles and weights: guide/profiles.md
      - Parameter proposals: guide/oracle.md
      - Refine and quality: guide/quality.md
      - Parameter search: guide/search.md
      - Export and I/O: guide/export.md
  - Algorithm:
      - Overview: algorithm/index.md
      - Robustness: algorithm/robustness.md
  - API reference:
      - Overview: api/index.md
      - skeletonize / Skeleton: api/skeleton.md
      - MCFS driver: api/mcfs.md
      - Settings: api/config.md
      - Parameters: api/params.md
      - Search: api/search.md
      - Quality: api/quality.md
      - Mesh utilities: api/mesh.md
      - Curve I/O: api/io.md
      - Geometry: api/geometry.md

watch:
  - pymcfs
