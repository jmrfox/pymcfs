[project]
name = "pymcfs"
version = "0.1.0"
description = "Mean-curvature-flow skeletonization for triangle meshes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.5.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.6",
    "networkx>=3.5",
    "numba>=0.66.0",
    "numpy>=2.3.2",
    "plotly>=6.3.0",
    "pymeshlab>=2025.7",
    "pytest>=8.4.2",
    "rtree>=1.3.0",
    "scipy>=1.16.1",
    "trimesh>=4.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupytext>=1.19.5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
]
cholmod = [
  "scikit-sparse>=0.4",
]

[tool.pytest.ini_options]
markers = [
  "slow: long-running regression (e.g. full TS1 skeletonization)",
]
