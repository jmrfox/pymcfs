[project]
name = "pymcfs"
version = "0.1.0"
description = "Mean-curvature-flow skeletonization for triangle meshes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.5",
    "numba>=0.66.0",
    "numpy>=2.3.2",
    "rtree>=1.3.0",
    "scipy>=1.16.1",
    "trimesh>=4.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pymcfs"]

[tool.hatch.build.targets.sdist]
only-include = [
    "pymcfs",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "ipython>=9.5.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.5",
    "matplotlib>=3.10.6",
    "plotly>=6.3.0",
    "pytest>=8.4.2",
]
docs = [
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.0,<10",
    "mkdocstrings[python]>=0.26.0",
    "ruff>=0.9.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.10.6",
    "plotly>=6.3.0",
]
test = [
    "pytest>=8.4.2",
]
cholmod = [
    "scikit-sparse>=0.4",
]
# Embree ray backend for pole gating. Single precision: only accurate for
# meshes at unit-ish scale near the origin, and requires fast_gating=True.
embree = [
    "embreex>=4.4",
]

[tool.pytest.ini_options]
markers = [
    "e2e: full end-to-end skeletonization on real meshes (e.g. TS1)",
]
