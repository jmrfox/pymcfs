# Match MASCAF: uv + docs group, build into $READTHEDOCS_OUTPUT.
# https://pymcfs.readthedocs.io/

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install uv
    - uv sync --group docs
    - uv run mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
